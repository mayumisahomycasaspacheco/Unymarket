<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Unymarket</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <button class="icono" id="boton_comprar" style="left:4% ; top:12%;">
            <img src="imagenes/comprar.png" alt="comprar.exe">
        </button>
        <button class="icono" id="boton_vender" style="left:4% ; top:36%;">
            <img src="imagenes/vender.png" alt="vender.exe">
        </button>
        <button class="icono" id="boton_perfil" style="left:4% ; top:60%;">
            <img src="imagenes/perfil.png" alt="perfil.exe">
        </button>
        <button id="boton_inicio">
            <img src="imagenes/inicio.png" alt="inicio">
        </button>

        <div id="ventana_comprar" class="oculta">
            <img src="imagenes/ventana_comprar.png" alt="ventana_comprar.exe">

            <button class="boton_ventana" id="boton_cerrar" style="left:89%;">
                <img src="imagenes/cerrar.png" alt="cerrar">
            </button>

            <div class ="seccion_oculta" id="seccion_libros">
                <p>Aquí iran los libros</p>
            </div>

            <button class="categoria" id="boton_libros">
                <img src="imagenes/Libros.png" alt="Libros">
            </button>

        </div>

        <div id="ventana_perfil" class="oculta">
            <img src="imagenes/ventana_perfil.png" alt="ventana_perfil.exe">

            <button class="boton_ventana" id="boton_cerrar_perfil" style="left:89%;">
                <img src="imagenes/cerrar.png" alt="cerrar">
            </button>
        </div>

        <div id="ventana_vender" class="oculta">
            <img src="imagenes/ventana_vender.png" alt="ventana_vender.exe">

            <button class="boton_ventana" id="boton_cerrar_vender" style="left:89%;">
                <img src="imagenes/cerrar.png" alt="cerrar">
            </button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
